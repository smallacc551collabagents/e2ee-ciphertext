# CD: Fastify backend -> Render on push to main.
# Required GitHub repo secret:
#   RENDER_DEPLOY_HOOK_URL - Render service > Settings > Deploy Hook URL
# If it is not set, the job skips cleanly instead of failing.
# Runtime env (DATABASE_URL, SESSION_SECRET, ...) is set in Render, never here.
name: Deploy backend (Render)
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/**"
      - ".github/workflows/deploy-backend.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
concurrency:
  group: deploy-backend-production
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Check secrets
        id: guard
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not configured; skipping backend deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy hook
        if: steps.guard.outputs.enabled == 'true'
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null && echo "Render deploy triggered."

      # Alternative (reference): Render API with RENDER_API_KEY + RENDER_SERVICE_ID secrets.
