# NOTE: Auto-deploy on push is disabled during the Vercel account migration; run manually via workflow_dispatch. Re-enable the push trigger once hosting move is done.
# CD: Next.js frontend -> Vercel (production) on push to main.
# Required GitHub repo secrets:
#   VERCEL_TOKEN       - Vercel personal/team access token
#   VERCEL_ORG_ID      - Vercel team/org id (from .vercel/project.json after `vercel link`)
#   VERCEL_PROJECT_ID  - Vercel project id (project Root Directory = frontend)
# If VERCEL_TOKEN is not set, the job skips cleanly instead of failing.
name: Deploy frontend (Vercel)
on:
  workflow_dispatch:
concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check secrets
        id: guard
        working-directory: .
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets not configured; skipping frontend deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: pnpm
      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        if: steps.guard.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.guard.outputs.enabled == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        if: steps.guard.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
